# Example secrets for sauna-controller.yaml
#
# Copy this file to "secrets.yaml" (same folder) and fill in your own values.
# secrets.yaml is git-ignored — never commit real passwords or keys.

# WiFi the controller joins
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"

# Home Assistant / native API encryption key — must be a base64 string that decodes to 32 bytes.
# Generate one with:  python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
api_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY="

# Password for over-the-air firmware updates (esphome run / upload over WiFi)
ota_password: "choose-an-ota-password"

# Password for the web page login (username is "admin").
# The web login is plain HTTP, so keep the controller off the internet and use a password
# you don't use anywhere else.
web_password: "choose-a-web-password"
